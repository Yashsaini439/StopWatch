<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Font for sleek numbers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Centered container -->
  <div class="container">
    <!-- Time Display Label -->
    <div class="display-wrapper">
      <label id="display">00:00:00</label>
    </div>

    <!-- Lap & Start Buttons -->
    <div class="controls">
      <button id="lapResetBtn" class="btn btn-secondary">Lap</button>
      <button id="startStopBtn" class="btn btn-primary">Start</button>
    </div>

    <div class="laps-wrapper">
      <ul id="lapsList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
